name: Update and Deploy RSS Feed

on:
  schedule:
    # 日本時間 (JST) 朝6時 (UTC 21:00) と 夜6時 (UTC 09:00) に自動実行
    - cron: '0 21,9 * * *'
  push:
    branches:
      - main
  workflow_dispatch: # GitHubのActionsタブから手動実行可能

# GitHub Pages へのデプロイに必要なパーミッション
permissions:
  contents: read
  pages: write
  id-token: write

# 同時デプロイの競合防止
concurrency:
  group: 'pages'
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate RSS Feed and Preview Page
        run: npm run generate

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
